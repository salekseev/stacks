# Builds the nod images from an n8n-io/nod release and publishes them as
# ghcr.io packages. Upstream publishes no images, and Portainer Git deploy
# cannot build.
#
# Tag contract: the image tags in stacks/nod.yaml are the only pin. All of them
# carry one version X.Y.Z; this workflow reads it, checks out upstream tag
# nod-vX.Y.Z and tags the images X.Y.Z. Renovate bumps the tags from upstream
# releases (customManagers in renovate.json). PRs build for verification (no
# push); master pushes.
#
# Design: docs/superpowers/specs/2026-11-21-nod-stack-design.md
# Plan:   docs/superpowers/plans/2026-11-21-nod-stack.md
name: nod images

on:
  push:
    branches: [master]
    paths:
      - stacks/nod/**
      - stacks/nod.yaml
      - .github/workflows/nod-images.yml
  pull_request:
    paths:
      - stacks/nod/**
      - stacks/nod.yaml
      - .github/workflows/nod-images.yml
  workflow_dispatch:

concurrency:
  group: nod-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: upstream
            dockerfile: upstream/deployment/self-host/Dockerfile
          - image: browser
            context: upstream
            dockerfile: upstream/Dockerfile.browser
          - image: workspace
            context: upstream
            dockerfile: upstream/Dockerfile.workspace
          # Ours: bakes upstream's docker-proxy.mjs into the node base image.
          # Narrower context because upstream's root .dockerignore excludes
          # docker-proxy.mjs.
          - image: runtime
            context: upstream/deployment/self-host
            dockerfile: stacks/nod/runtime.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image coordinates (tag = the one version pinned in stacks/nod.yaml)
        id: meta
        run: |
          versions=$(grep -oP 'image: ghcr\.io/salekseev/nod-[a-z]+:\K\S+' stacks/nod.yaml | sort -u)
          if ! [[ "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::stacks/nod.yaml must pin every nod image to one X.Y.Z version, found: ${versions//$'\n'/ }"
            exit 1
          fi
          echo "tag=${versions}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/nod-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Check out n8n-io/nod at the pinned release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n8n-io/nod
          ref: nod-v${{ steps.meta.outputs.tag }}
          path: upstream
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=nod-${{ matrix.image }}
          cache-to: type=gha,scope=nod-${{ matrix.image }},mode=max
