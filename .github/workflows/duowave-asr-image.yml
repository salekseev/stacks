# Builds the DuoWave recognition server and publishes it as a public ghcr.io
# package. Upstream publishes no ASR image, and Portainer Git deploy cannot
# build.
#
# Tag contract: the image is tagged with the SHORT SHA (7) in
# stacks/duowave/asr/UPSTREAM — the duowave commit those files were copied
# from. stacks/duowave.yaml pins image: to the same SHA. Bump the copied
# asr-server and that file together. PRs build for verification (no push);
# master pushes.
name: duowave asr image

on:
  push:
    branches: [master]
    paths:
      - stacks/duowave/asr/**
      - stacks/duowave.yaml
      - .github/workflows/duowave-asr-image.yml
  pull_request:
    paths:
      - stacks/duowave/asr/**
      - stacks/duowave.yaml
      - .github/workflows/duowave-asr-image.yml
  workflow_dispatch:

concurrency:
  group: duowave-asr-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image coordinates (tag = upstream short SHA)
        id: meta
        run: |
          sha=$(tr -d '[:space:]' < stacks/duowave/asr/UPSTREAM)
          echo "tag=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/duowave-asr" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: stacks/duowave/asr
          file: stacks/duowave/asr/Dockerfile
          platforms: linux/amd64
          build-args: |
            TORCH=cpu
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=duowave-asr
          cache-to: type=gha,scope=duowave-asr,mode=max
