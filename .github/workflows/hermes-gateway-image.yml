# Builds the Hermes gateway with the 1Password CLI (stacks/hermes-gateway/Dockerfile) and publishes
# it as a ghcr.io package. Hermes runs `op` in the gateway process and never installs it.
#
# Tag contract: <hermes tag>-op<op version>, both read from the Dockerfile (e.g. v0.23.4-op2.42.0) —
# derived, never hand-written. Renovate bumps the FROM / COPY --from lines and the matching tag in
# stacks/hermes.yaml in one pull request (customManagers + the "hermes" group in renovate.json);
# the build fails if they disagree. PRs build for verification (no push); master pushes. The
# package must be public for Portainer to pull it.
name: hermes-gateway image

on:
  push:
    branches: [master]
    paths:
      - stacks/hermes-gateway/**
      - stacks/hermes.yaml
      - .github/workflows/hermes-gateway-image.yml
  # Pull requests run this through .github/workflows/ci.yml, which decides
  # from the changed paths whether to call it.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: hermes-gateway-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image coordinates (tag = hermes tag + -op + op version)
        id: meta
        run: |
          hermes=$(sed -nE 's#^FROM nousresearch/hermes-agent:(v[0-9][^@ ]*).*#\1#p' stacks/hermes-gateway/Dockerfile)
          op=$(sed -nE 's#^COPY --from=1password/op:([0-9][^@ ]*) .*#\1#p' stacks/hermes-gateway/Dockerfile)
          test -n "$hermes" && test -n "$op"
          tag="${hermes}-op${op}"
          if ! grep -qF "ghcr.io/salekseev/hermes-gateway:${tag}" stacks/hermes.yaml; then
            echo "::error::stacks/hermes.yaml must run ghcr.io/salekseev/hermes-gateway:${tag}, the tag this build publishes"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/hermes-gateway" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stacks/hermes-gateway
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=hermes-gateway
          cache-to: type=gha,scope=hermes-gateway,mode=max

      - name: Verify op and the docker CLI are on the gateway's PATH
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" -c '
            set -e
            op --version | grep -Eq "^[0-9]+\."
            command -v docker
          '
