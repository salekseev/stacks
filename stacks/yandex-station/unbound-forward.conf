# Replace the six Query Forwarding rows. Do not leave them on 127.0.0.1.
# Delete those UI rows first, then copy this file to
# /usr/local/etc/unbound.opnsense.d/yandex-forward.conf
#   configctl unbound check && configctl unbound restart
# A duplicate name in the UI and in this file makes Unbound refuse to start.
#
# Rows this file replaces:
#   kinopoisk.ru, yandex.ru, strm.yandex.ru, ott.yandex.ru,
#   yandex.net, yastatic.net
# The disabled blank-domain rows and the DNS-over-TLS "." forward stay.
#
# Every name below goes to dnsmasq on silverstone port 1153.
# dnsmasq answers the speaker names itself and forwards every other
# name to a public resolver. Its upstream must not be 192.168.1.1,
# or Unbound and dnsmasq will chase the same zone.
# Install this only after: dig @192.168.1.10 -p 1153 quasar.yandex.net A
# Do not install unbound-iot-view.conf.

forward-zone:
	name: "kinopoisk.ru"
	forward-addr: 192.168.1.10@1153
forward-zone:
	name: "yandex.ru"
	forward-addr: 192.168.1.10@1153
forward-zone:
	name: "strm.yandex.ru"
