# Unbound view for OPNsense IoT only.
# Copy to /usr/local/etc/unbound.opnsense.d/yandex-iot.conf on the firewall,
# then: configctl unbound check && configctl unbound restart
#
# IoT is opt1, VLAN 99 on ix2, 192.168.99.0/24, gateway 192.168.99.1.
# interface-view follows the VLAN, so a Verizon prefix change does not
# edit this file. access-control-view covers IPv4 if the interface name
# is not visible to Unbound. Do not add these names as Host Overrides:
# that screen applies to every client.
#
# view-first lets every other name resolve normally. static makes an
# AAAA query for a hijacked name come back empty. IoT has IPv6, so an
# AAAA answer would walk around silverstone. The `!` CDN wildcards from
# domains/yandex.txt are absent on purpose. `quasar:31120` is an
# https-proxy upstream directive, not a hostname.
server:
	interface-view: "ix2_vlan99" "yandex"
	access-control-view: 192.168.99.0/24 "yandex"

view:
	name: "yandex"
	view-first: yes

	local-zone: "quasar.yandex.net." static
	local-data: "quasar.yandex.net. IN A 192.168.1.10"
	local-zone: "quasar.yandex.ru." static
	local-data: "quasar.yandex.ru. IN A 192.168.1.10"
