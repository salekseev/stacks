server:
define-tag: "yandex-iot"
# Speaker DNS for IoT sources only.
# Installed as /usr/local/etc/unbound.opnsense.d/yandex-iot-acl.conf.
# Unbound start copies that directory to /var/unbound/etc.
# The file starts with server: because the include site is not guaranteed.
# access-control-tag and local-zone-tag are server options. A view: block is not.
# interface-tag and interface-view are not used. The generated ACL allows
# 0.0.0.0/0 and ::/0, and any access-control rule overrides interface-*.
# interface-view on ix2_vlan99 took the resolver down.
# Do not add these names as global Host Overrides. Those apply to the LAN.
# The IPv6 prefix is the current IoT delegation and can renumber.
# 192.168.99.0/24 does not. Speaker DNS stays on 192.168.99.1.
access-control-tag: 192.168.99.0/24 "yandex-iot"
access-control-tag: 2600:4040:5b42:2599::/64 "yandex-iot"
local-zone: "quasar.yandex.net." static
local-data: "quasar.yandex.net. A 192.168.99.10"
local-zone-tag: "quasar.yandex.net." "yandex-iot"
