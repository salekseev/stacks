# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json

services:

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: hindsight-cloudflared
    command: --config /etc/cloudflared/config.yml tunnel run
    user: 568:568
    configs:
      - source: cloudflared
        target: /etc/cloudflared/config.yml
        uid: "568"
        gid: "568"
        mode: 0440
    volumes:
      - /mnt/spool/apps/config/hindsight/cloudflared:/etc/cloudflared
    restart: unless-stopped

  hindsight:
    # All-in-one image (standalone target): runs both hindsight-api on 8888 and
    # the Next.js Control Plane on 9999 via /app/start-all.sh.
    image: ghcr.io/vectorize-io/hindsight:0.9.1-slim
    container_name: hindsight
    # env_file: would be resolved at compose-parse time, which fails when
    # Portainer parses the stack inside its own container without the host
    # config dir mounted. Loading via a Docker secret defers path resolution
    # to the daemon on the host, same way `hindsight_db_password` is wired.
    # Order: docker `environment:` is set first; then the secret file is sourced
    # via `set -a` so secrets cleanly override any defaults if needed. Keep only
    # secrets in /run/secrets/hindsight_env; non-secrets live here.
    entrypoint: ["sh", "-c", "set -a; . /run/secrets/hindsight_env; set +a; exec /app/start-all.sh"]
    user: "568:568"
    secrets:
      - hindsight_env
    volumes:
      # Dedicated Codex auth home (CODEX_HOME=/codex). NOT :ro — the provider
      # writes the rotated refresh token back, and a read-only mount breaks
      # refresh on the first rotation.
      - /mnt/spool/apps/config/hindsight/codex:/codex
    environment:
      # Worker identity: stable ID survives restarts so the worker can reclaim
      # its own in-progress tasks (avoids dead-worker stuck-task issue #624).
      HINDSIGHT_API_WORKER_ID: hindsight-worker-1
      # API: search backends + reverse-proxy subpath
      HINDSIGHT_API_VECTOR_EXTENSION: vchord
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: vchord
      HINDSIGHT_API_BASE_PATH: /api
      # API: default LLM (recall, reflect, consolidation) via Hindsight's native
      # multi-LLM failover chain — no proxy hop.
      #
      # Primary: ChatGPT/Codex subscription, gpt-5.6-luna, through the native
      # openai-codex transport. LiteLLM's chatgpt/ provider is deliberately NOT
      # used: it documents no gpt-5.6 models, and third-party originators get
      # "Model not found gpt-5.6-luna-free-1p-codexswic-ev3" over ChatGPT OAuth
      # while the Codex originator succeeds on the same credentials
      # (openai/codex#31967). The native provider carries that originator.
      HINDSIGHT_API_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_LLM_MODEL: gpt-5.6-luna
      # Dedicated Codex auth home. Codex refresh tokens are single-use and
      # rotate, so a long-running service sharing ~/.codex/auth.json with an
      # interactive CLI ends up holding a stale token: reflect then fails with
      # refresh_token_reused while recall and /health stay green.
      CODEX_HOME: /codex
      # Member 1: local vLLM on the 192.168.1.147 box (that host is NOT
      # silverstone). REASONING_EFFORT=none because gemma-4 otherwise emits a
      # thinking block that burns tokens on fact extraction.
      HINDSIGHT_API_LLM_1_PROVIDER: openai
      HINDSIGHT_API_LLM_1_BASE_URL: http://192.168.1.147:8080/v1
      HINDSIGHT_API_LLM_1_MODEL: gemma-4-12b
      HINDSIGHT_API_LLM_1_API_KEY: none
      HINDSIGHT_API_LLM_1_REASONING_EFFORT: none
      HINDSIGHT_API_LLM_STRATEGY: '{"mode": "failover"}'
      # Failover advances only after a member exhausts its own retries; the
      # default of 3 would burn three luna attempts per call under a 429.
      HINDSIGHT_API_LLM_MAX_RETRIES: "1"
      HINDSIGHT_API_LLM_TIMEOUT: "600"
      # Was 1, tuned for llama.cpp --parallel 1. vLLM batches continuously and
      # the primary is a remote API, so serial calls were leaving both idle.
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "4"
      # DB: bump asyncpg client timeout — pgvector ANN query in retain phase 1
      # exceeded the 60 s default once the facts table grew.
      HINDSIGHT_API_DB_COMMAND_TIMEOUT: "180"
      # API: embeddings via local TEI (BAAI/bge-small-en-v1.5, 384d)
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: tei
      HINDSIGHT_API_EMBEDDINGS_TEI_URL: http://hindsight-tei-embed:80
      HINDSIGHT_API_RERANKER_PROVIDER: tei
      HINDSIGHT_API_RERANKER_TEI_URL: http://hindsight-tei-reranker:80
      HINDSIGHT_API_RERANKER_TEI_BATCH_SIZE: "64"
      HINDSIGHT_API_RERANKER_TEI_MAX_CONCURRENT: "4"
      # API: tenant auth extension (key itself stays in secret env)
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      # CP: dataplane URL (key stays in secret env)
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888/api
    expose:
      - "8888"
      - "9999"
    depends_on:
      hindsight-db:
        condition: service_healthy
    restart: unless-stopped
    # Phase-2: also join the host-created shared-services net so the hermes stack can
    # reach this dataplane by container name (http://hindsight:8888/api). `default` is
    # re-listed explicitly so siblings (hindsight-db, tei-*) stay reachable.
    networks:
      - default
      - shared-services

  hindsight-db:
    image: ghcr.io/tensorchord/vchord-suite:pg18-20260401
    container_name: hindsight-db
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_preload_libraries=vchord.so,vchord_bm25.so,pg_tokenizer.so"
    # Docker default /dev/shm is 64 MB; PG parallel workers allocate shm segs
    # for hash/sort/agg and exhaust it under concurrent /stats fanout, raising
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 2gb
    user: "568:568"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/hindsight_db_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    configs:
      - source: hindsight-db-init
        target: /docker-entrypoint-initdb.d/01-extensions.sql
        mode: 0444
    secrets:
      - hindsight_db_password
    volumes:
      - /mnt/spool/apps/data/hindsight/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hindsight-db-backup:
    # pg_dump --format=custom with built-in daily/weekly/monthly rotation.
    # Backups land in a separate host path so a corrupt data dir can't take them.
    image: prodrigestivill/postgres-backup-local:18
    container_name: hindsight-db-backup
    user: "568:568"
    environment:
      POSTGRES_HOST: hindsight-db
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/hindsight_db_password
      POSTGRES_EXTRA_OPTS: "--format=custom --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    secrets:
      - hindsight_db_password
    volumes:
      - /mnt/spool/apps/data/hindsight/backups:/backups
    depends_on:
      hindsight-db:
        condition: service_healthy
    restart: unless-stopped

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.3
    container_name: hindsight-tei-embed
    user: "568:568"
    command:
      - "--model-id=BAAI/bge-small-en-v1.5"
      - "--port=80"
      - "--max-concurrent-requests=256"
      - "--max-batch-tokens=4096"
      - "--auto-truncate"
      - "--max-client-batch-size=64"
    environment:
      HF_HOME: /data
    volumes:
      - /mnt/spool/apps/data/hindsight/tei-embed/cache:/data
    expose:
      - "80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.3
    container_name: hindsight-tei-reranker
    user: "568:568"
    command:
      - "--model-id=cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "--port=80"
      - "--max-concurrent-requests=256"
      - "--max-batch-tokens=4096"
      - "--payload-limit=33554432"
      - "--auto-truncate"
      # Match Hindsight's HINDSIGHT_API_RERANKER_TEI_BATCH_SIZE (default TEI cap is 32).
      - "--max-client-batch-size=64"
    environment:
      HF_HOME: /data
    volumes:
      - /mnt/spool/apps/data/hindsight/tei/cache:/data
    expose:
      - "80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped


configs:
  hindsight-db-init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
      CREATE EXTENSION IF NOT EXISTS pg_tokenizer CASCADE;
      CREATE EXTENSION IF NOT EXISTS vchord_bm25 CASCADE;
      -- pg_tokenizer/vchord_bm25 install into their own catalog schemas;
      -- hindsight calls tokenize() unqualified, so put both on search_path.
      ALTER DATABASE postgres SET search_path = public, tokenizer_catalog, bm25_catalog;
      -- $$$$ → $$ inside compose (compose escapes a literal $ as $$).
      SELECT tokenizer_catalog.create_tokenizer('llmlingua2', $$$$ model = "llmlingua2" $$$$);
  cloudflared:
    content: |
      tunnel: 5ebada53-82c5-40d9-baa6-030aa0d9ad75
      credentials-file: /etc/cloudflared/creds/5ebada53-82c5-40d9-baa6-030aa0d9ad75.json
      ingress:
        # Dataplane (MCP, raw v1 API, FastAPI docs) — port 8888
        - hostname: hindsight.alekseev.us
          path: ^/api/(mcp|v1|docs|redoc|openapi.json)(/.*)?$
          service: http://hindsight:8888
        # Everything else (dashboard UI + CP's own /api/* proxy routes) → CP on 9999
        - hostname: hindsight.alekseev.us
          service: http://hindsight:9999
        - service: http_status:404

secrets:
  hindsight_db_password:
    file: /mnt/spool/apps/config/hindsight/secrets/db_password
  hindsight_env:
    file: /mnt/spool/apps/config/hindsight/env

networks:
  # Created out-of-band on the host: `docker network create shared-services`.
  # Shared with the hermes stack so hermes-gateway resolves `hindsight` by name.
  shared-services:
    external: true
