# Air-gap rebuild of the five v3rt3p images. Not used by Portainer.
# Portainer Git deploy builds any stack file that contains build:, and that
# build runs inside the Portainer container (mkdir /docker: permission denied).
#
#   docker compose -f stacks/yandex-station.yaml \
#     -f stacks/yandex-station.build.yaml build
#
# Image tags in yandex-station.yaml must stay equal to these submodule SHAs.

services:
  https-proxy:
    build:
      context: ./yandex-station/https-proxy
  quasar-server:
    build:
      context: ./yandex-station/quasar-server
  quasistreaming-gigam:
    build:
      context: ./yandex-station/quasistreaming-gigam
      dockerfile: Dockerfile.cpu
  supertonic-tts:
    build:
      context: ./yandex-station/supertonic-tts
  processor:
    build:
      context: ./yandex-station/processor
