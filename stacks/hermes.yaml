# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
#
# Hermes agent stack — first-party gateway + dashboard.
# See docs/superpowers/specs/2026-06-30-hermes-gateway-openwebui-port-design.md
# Secrets split into two tiers:
#   Hardcoded in compose (non-secret):
#     HERMES_TUNNEL_ID = 0a0fe09f-7724-4e7e-9ad8-0326b70fa07f (Cloudflare tunnel UUID, inline below)
#   /opt/data/.env on-disk (gateway-only secrets; written to /mnt/spool/apps/data/hermes/gateway/.env):
#     ANTHROPIC_TOKEN                   - Claude OAuth setup-token (sk-ant-oat-...)
#     HERMES_DASHBOARD_OIDC_ISSUER        - CF Access Generic OIDC SaaS issuer (.../cdn-cgi/access/sso/oidc/<app-id>)
#     HERMES_DASHBOARD_OIDC_CLIENT_ID     - CF Access SaaS-OIDC client id (== app-id)
#     HERMES_DASHBOARD_OIDC_CLIENT_SECRET - CF Access SaaS-OIDC client secret
#     HINDSIGHT_API_KEY                 - Hindsight tenant key (== server HINDSIGHT_API_TENANT_API_KEY)
#     OP_SERVICE_ACCOUNT_TOKEN          - 1Password service account (scoped read-only to hermes vault)
#     CODEX_LB_API_KEY                  - this stack's codex-lb API key (see "Model gateways" below)
#     CLIPROXYAPI_API_KEY               - a key from cliproxyapi's access.api-keys
# Model gateways: the gateway process (not the dind sandbox) makes the model calls, and it is on
# shared-services, so codex-lb and cliproxyapi resolve by name with no compose change. Add them once
# in /opt/data/config.yaml; key_env points at the /opt/data/.env entries above:
#   custom_providers:
#     - name: codex-lb
#       base_url: http://codex-lb:2455/v1
#       key_env: CODEX_LB_API_KEY
#     - name: cliproxyapi
#       base_url: http://cliproxyapi:8317/v1
#       key_env: CLIPROXYAPI_API_KEY
# then pick one with `hermes model` (or `/model`). Model names come from each gateway's /v1/models.
# Nothing published to host; only cloudflared reaches origins, gated by one Cloudflare Access app.

services:

  hermes-gateway:
    restart: unless-stopped
    # First-party agent daemon. `gateway run` serves (HERMES_DASHBOARD=1) the dashboard on :9119 as a co-resident s6-rc service. s6 supervises
    # both, so a mis-start restarts in-container (no Docker crash-loop).
    # stacks/hermes-gateway/Dockerfile: nousresearch/hermes-agent plus the 1Password CLI, published
    # by CI as <hermes tag>-op<op version>. Hermes resolves op:// references in this process and never
    # installs op itself. op needs mode-600 session files in TMPDIR: see stacks/AGENTS.md.
    # Slim base tag: Bot Screen runs in the docker sandbox (dind below), not in this container, so the
    # -desktop packages (~930 MB) are not needed here. Upstream moved from calver (v2026.9.24) to
    # semver (v0.23.x); the docker image still ships the docker CLI (verified 2026-11-26).
    image: ghcr.io/salekseev/hermes-gateway:v0.23.4-op2.42.0
    container_name: hermes-gateway
    hostname: hermes-gateway
    command: gateway run
    depends_on:
      dind:
        condition: service_healthy
    environment:
      # Bot Screen sandbox: terminal.backend=docker drives this daemon (the dind service), never the
      # host's. See the dind service for the one-time config.yaml settings.
      - DOCKER_HOST=tcp://dind:2375
      # /opt/data (HERMES_HOME) is chowned to this uid/gid by the image's s6 init.
      - HERMES_UID=1000
      - HERMES_GID=1000
      # First-party dashboard — fail-closed on a non-loopback bind. Auth = native OIDC (self_hosted
      # provider) against Cloudflare Access as a Generic OIDC SaaS IdP. No basic-auth, no edge Access.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_PUBLIC_URL=https://hermes.alekseev.us
      # OIDC config lives in /opt/data/.env (gateway-only), provisioned on the host:
      #   HERMES_DASHBOARD_OIDC_ISSUER, HERMES_DASHBOARD_OIDC_CLIENT_ID, HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      # NEVER set HERMES_DASHBOARD_INSECURE (no-op since June-2026 hardening; keep absent).
      # Do NOT set HERMES_DASHBOARD_OAUTH_CLIENT_ID (that selects the wrong `nous` provider).
      # ANTHROPIC_TOKEN is set in /opt/data/.env (not Portainer) — gateway-only secret.
      # Phase-2 Hindsight semantic memory — AUGMENTS (does not replace) built-in Markdown memory.
      # Reaches the self-hosted hindsight dataplane by container name over the shared-services net.
      # api_url carries /api (server HINDSIGHT_API_BASE_PATH); the REST client appends /v1/... .
      # NOTE: `memory.provider: hindsight` must be set ONCE in config.yaml (no env selector exists)
      # — see docs/superpowers/specs/2026-07-01-hermes-hindsight-phase2-design.md §6 and §10.
      - HINDSIGHT_MODE=local_external
      - HINDSIGHT_API_URL=http://hindsight:8888/api
      - HINDSIGHT_BANK_ID=hermes
      # HINDSIGHT_API_KEY is set in /opt/data/.env (not Portainer) — gateway-only secret.
      # Seal the read-only app venv. hindsight-client is baked into the image and
      # pinned EXACTLY ==0.6.1; the runtime must NOT attempt a lazy pip install into
      # /opt/hermes/.venv (root-owned, read-only to the uid-1000 daemon) — that fails
      # and wedges retain. This is the Nous image's intended setting. NEVER upgrade the
      # client: any version other than 0.6.1 triggers a reinstall attempt that fails.
      - HERMES_DISABLE_LAZY_INSTALLS=1
    volumes:
      - /mnt/spool/apps/data/hermes/gateway:/opt/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9119/api/status',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hermes-net
      - shared-services
      - dind-net

  dind:
    restart: unless-stopped
    # Private Docker daemon for Hermes' Bot Screen. With terminal.backend=docker and
    # bot_desktop.placement=auto, Hermes runs the sandbox container (Xvnc + Xfce + headed Chromium
    # + cua-driver) through this daemon and drives it with `docker exec`. Nothing here touches the
    # host's Docker. Tradeoff: dind must be privileged, so a sandbox escape is a dind-container
    # compromise; the unauthenticated tcp:2375 is root-equivalent, so it sits on dind-net, shared
    # only with hermes-gateway. Not exposed to hermes-net or published.
    #
    # One-time setup, after first deploy (config.yaml lives in /mnt/spool/apps/data/hermes/gateway):
    #   docker exec hermes-gateway hermes config set terminal.backend docker
    #   docker exec hermes-gateway hermes config set terminal.docker_image ghcr.io/salekseev/hermes-sandbox:v0.23.4-desktop-chrome
    #   docker exec hermes-gateway hermes config set bot_desktop.placement terminal
    #   docker exec hermes-gateway hermes config set browser.headed true
    #   docker exec hermes-gateway hermes computer-use screen status
    # That image is stacks/hermes-sandbox/Dockerfile: the upstream -desktop sandbox with Google Chrome
    # swapped in for Playwright's Chromium (CI publishes it; Hermes ignores browser.executable_path in
    # sandbox placement). It is pinned like the gateway; bump both together. Sandbox state (/root,
    # /workspace, browser profile) lives in dind-data, not under /opt/data: bind sources resolve
    # on THIS daemon's filesystem.
    # Camofox is gone (it left Hermes core in v0.23.x). browser_exec and computer_use both use
    # Hermes' own headed Chromium in this sandbox, so a human can take over from Hermes Desktop.
    image: docker:29.10.1-dind
    container_name: hermes-dind
    hostname: dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=            # empty = plain tcp://0.0.0.0:2375, only on dind-net
    volumes:
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dind-net

  cloudflared:
    restart: unless-stopped
    image: cloudflare/cloudflared:2026.11.2
    container_name: hermes-cloudflared
    hostname: hermes-cloudflared
    command: --config /etc/cloudflared/config.yml tunnel run
    user: "568:568"
    configs:
      - source: cloudflared
        target: /etc/cloudflared/config.yml
        uid: "568"
        gid: "568"
        mode: 0440
    volumes:
      - /mnt/spool/apps/config/hermes/cloudflared:/etc/cloudflared/creds
    depends_on:
      - hermes-gateway
    networks:
      - hermes-net

configs:
  cloudflared:
    content: |
      tunnel: 0a0fe09f-7724-4e7e-9ad8-0326b70fa07f
      credentials-file: /etc/cloudflared/creds/tunnel.json
      ingress:
        - hostname: hermes.alekseev.us
          service: http://hermes-gateway:9119
          # OIDC-only: the dashboard's own Cloudflare-Access-OIDC gate is the sole auth. No edge Access
          # and no origin-side JWT check (a self-hosted Access app with audTag was tried 2026-11-26 and
          # removed; re-add `originRequest.access` with its audTag to bring it back).
        - service: http_status:404

volumes:
  dind-data:    # dind's images and Bot Screen sandbox state

networks:
  hermes-net:
  dind-net:   # hermes-gateway <-> dind only
  # Created out-of-band on the host: `docker network create shared-services`.
  # Shared with the hindsight stack so hermes-gateway resolves `hindsight` by name.
  shared-services:
    external: true
