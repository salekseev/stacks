# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
#
# Hermes agent stack — first-party gateway + Open WebUI + dashboard.
# See docs/superpowers/specs/2026-06-30-hermes-gateway-openwebui-port-design.md
# Secrets split into two tiers:
#   Portainer stack env vars (cross-container — must be set in Portainer UI):
#     CAMOFOX_SHARED_KEY    - camofox REST bearer (shared between camofox and hermes-gateway)
#     HERMES_API_SERVER_KEY - bearer for the gateway OpenAI API :8642 (== Open WebUI OPENAI_API_KEY); >=8 chars
#   Hardcoded in compose (non-secret):
#     HERMES_TUNNEL_ID = 0a0fe09f-7724-4e7e-9ad8-0326b70fa07f (Cloudflare tunnel UUID, inline below)
#   /opt/data/.env on-disk (gateway-only secrets; written to /mnt/spool/apps/data/hermes/gateway/.env):
#     ANTHROPIC_TOKEN                   - Claude OAuth setup-token (sk-ant-oat-...)
#     HERMES_DASHBOARD_OIDC_ISSUER        - CF Access Generic OIDC SaaS issuer (.../cdn-cgi/access/sso/oidc/<app-id>)
#     HERMES_DASHBOARD_OIDC_CLIENT_ID     - CF Access SaaS-OIDC client id (== app-id)
#     HERMES_DASHBOARD_OIDC_CLIENT_SECRET - CF Access SaaS-OIDC client secret
#     HINDSIGHT_API_KEY                 - Hindsight tenant key (== server HINDSIGHT_API_TENANT_API_KEY)
#     OP_SERVICE_ACCOUNT_TOKEN          - 1Password service account (scoped read-only to hermes vault)
# Nothing published to host; only cloudflared reaches origins, gated by one Cloudflare Access app.

services:

  camofox:
    restart: unless-stopped
    # redf0x1 fork of jo-inc/camofox-browser: same REST API, but ships the noVNC stack.
    # Server bearer = CAMOFOX_API_KEY (== CAMOFOX_SHARED_KEY). noVNC is on-demand via
    # POST /sessions/<userId>/toggle-display; x11vnc -nopw, gated only by Cloudflare Access.
    image: ghcr.io/redf0x1/camofox-browser:2.4.7
    container_name: camofox
    hostname: camofox
    environment:
      - CAMOFOX_HOST=0.0.0.0
      - CAMOFOX_PORT=9377
      - CAMOFOX_API_KEY=${CAMOFOX_SHARED_KEY}
      - CAMOFOX_AUTH_MODE=required
      - CAMOFOX_PROFILES_DIR=/home/node/.camofox/profiles
      - CAMOFOX_VNC_HOST=0.0.0.0
      - CAMOFOX_VNC_BASE_PORT=6080
      - CAMOFOX_VNC_RESOLUTION=1920x1080x24
      - CAMOFOX_HEADLESS=virtual
      - CAMOFOX_VNC_TIMEOUT_MS=86400000  # 24 hours (was 15 min) - prevent context restarts mid-operation
    volumes:
      - /mnt/spool/apps/data/hermes/camofox:/home/node/.camofox
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9377/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hermes-net

  op-init:
    # One-shot init container: copies the op CLI binary from the official 1Password image
    # into the op-bin named volume, which hermes-gateway mounts at /usr/local/sbin.
    # Runs once at stack start and exits 0; hermes-gateway waits on service_completed_successfully.
    # user: root required — 1password/op runs as opuser by default, which cannot write to the
    # root-owned Docker named volume on first creation.
    image: 1password/op:2.39.0
    container_name: hermes-op-init
    restart: "no"
    user: root
    entrypoint: ["cp", "/usr/local/bin/op", "/op-bin/op"]
    volumes:
      - op-bin:/op-bin

  hermes-gateway:
    restart: unless-stopped
    # First-party agent daemon. `gateway run` serves the OpenAI-compatible API on :8642 and
    # (HERMES_DASHBOARD=1) the dashboard on :9119 as a co-resident s6-rc service. s6 supervises
    # both, so a mis-start restarts in-container (no Docker crash-loop).
    image: nousresearch/hermes-agent:v2026.8.27
    container_name: hermes-gateway
    hostname: hermes-gateway
    command: gateway run
    depends_on:
      camofox:
        condition: service_healthy
      op-init:
        condition: service_completed_successfully
    environment:
      # /opt/data (HERMES_HOME) is chowned to this uid/gid by the image's s6 init.
      - HERMES_UID=1000
      - HERMES_GID=1000
      # OpenAI-compatible API server (consumed by Open WebUI)
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      # First-party dashboard — fail-closed on a non-loopback bind. Auth = native OIDC (self_hosted
      # provider) against Cloudflare Access as a Generic OIDC SaaS IdP. No basic-auth, no edge Access.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_PUBLIC_URL=https://hermes-dashboard.alekseev.us
      # OIDC config lives in /opt/data/.env (gateway-only), provisioned on the host:
      #   HERMES_DASHBOARD_OIDC_ISSUER, HERMES_DASHBOARD_OIDC_CLIENT_ID, HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      # NEVER set HERMES_DASHBOARD_INSECURE (no-op since June-2026 hardening; keep absent).
      # Do NOT set HERMES_DASHBOARD_OAUTH_CLIENT_ID (that selects the wrong `nous` provider).
      # Route all browser tools server-side through the camofox sidecar (same vars as before).
      - CAMOFOX_URL=http://camofox:9377
      - CAMOFOX_API_KEY=${CAMOFOX_SHARED_KEY}
      - CAMOFOX_USER_ID=operator
      - CAMOFOX_SESSION_KEY=visible-tab
      - CAMOFOX_ADOPT_EXISTING_TAB=true
      # ANTHROPIC_TOKEN is set in /opt/data/.env (not Portainer) — gateway-only secret.
      # Phase-2 Hindsight semantic memory — AUGMENTS (does not replace) built-in Markdown memory.
      # Reaches the self-hosted hindsight dataplane by container name over the shared-services net.
      # api_url carries /api (server HINDSIGHT_API_BASE_PATH); the REST client appends /v1/... .
      # NOTE: `memory.provider: hindsight` must be set ONCE in config.yaml (no env selector exists)
      # — see docs/superpowers/specs/2026-07-01-hermes-hindsight-phase2-design.md §6 and §10.
      - HINDSIGHT_MODE=local_external
      - HINDSIGHT_API_URL=http://hindsight:8888/api
      - HINDSIGHT_BANK_ID=hermes
      # HINDSIGHT_API_KEY is set in /opt/data/.env (not Portainer) — gateway-only secret.
      # Seal the read-only app venv. hindsight-client is baked into the image and
      # pinned EXACTLY ==0.6.1; the runtime must NOT attempt a lazy pip install into
      # /opt/hermes/.venv (root-owned, read-only to the uid-1000 daemon) — that fails
      # and wedges retain. This is the Nous image's intended setting. NEVER upgrade the
      # client: any version other than 0.6.1 triggers a reinstall attempt that fails.
      - HERMES_DISABLE_LAZY_INSTALLS=1
      # Prepend /opt/op-bin so the op CLI (mounted from op-init) is on PATH for uid 1000.
      # Cannot mount into /usr/local/bin (overlays node/uv/uvx) or /usr/local/sbin (root-only sbin).
      - PATH=/opt/op-bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /mnt/spool/apps/data/hermes/gateway:/opt/data
      - op-bin:/opt/op-bin:ro   # op binary from op-init
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9119/api/status',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hermes-net
      - shared-services

  open-webui:
    restart: unless-stopped
    # Daily chat client -> gateway /v1. No published ports: trusted-header SSO is only safe
    # because nothing but cloudflared can reach :8080 to forge Cf-Access-Authenticated-User-Email.
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: open-webui
    hostname: open-webui
    depends_on:
      hermes-gateway:
        condition: service_healthy
    environment:
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://hermes-gateway:8642/v1
      - OPENAI_API_KEY=${HERMES_API_SERVER_KEY}
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - ENABLE_LOGIN_FORM=false
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=Cf-Access-Authenticated-User-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=Cf-Access-Authenticated-User-Email
      - WEBUI_URL=https://hermes.alekseev.us
      - ENABLE_WEBSOCKET_SUPPORT=true
      - CORS_ALLOW_ORIGIN=https://hermes.alekseev.us
    volumes:
      - /mnt/spool/apps/data/hermes/open-webui:/app/backend/data
    networks:
      - hermes-net

  cloudflared:
    restart: unless-stopped
    image: cloudflare/cloudflared:2026.8.3
    container_name: hermes-cloudflared
    hostname: hermes-cloudflared
    command: --config /etc/cloudflared/config.yml tunnel run
    user: "568:568"
    configs:
      - source: cloudflared
        target: /etc/cloudflared/config.yml
        uid: "568"
        gid: "568"
        mode: 0440
    volumes:
      - /mnt/spool/apps/config/hermes/cloudflared:/etc/cloudflared/creds
    depends_on:
      - open-webui
      - hermes-gateway
      - camofox
    networks:
      - hermes-net

configs:
  cloudflared:
    content: |
      tunnel: 0a0fe09f-7724-4e7e-9ad8-0326b70fa07f
      credentials-file: /etc/cloudflared/creds/tunnel.json
      ingress:
        # Origin-side Cloudflare Access JWT validation. All three hosts share ONE Access app /
        # audTag (team alekseev); cloudflared verifies Cf-Access-Jwt-Assertion against the team
        # JWKS + audTag before proxying.
        - hostname: hermes.alekseev.us
          service: http://open-webui:8080
          access:
            required: true
            teamName: alekseev
            audTag:
              - f79eba4208644c03e8777ab7870842bc46887458b09d3ad19e74570b119bc37d
        - hostname: hermes-dashboard.alekseev.us
          service: http://hermes-gateway:9119
          # OIDC-only: the dashboard's own Cloudflare-Access-OIDC gate is the sole auth. No edge Access.
          # (hermes + hermes-browser below keep their edge `access:` blocks.)
        - hostname: hermes-browser.alekseev.us
          service: http://camofox:6080
          access:
            required: true
            teamName: alekseev
            audTag:
              - f79eba4208644c03e8777ab7870842bc46887458b09d3ad19e74570b119bc37d
        - service: http_status:404

volumes:
  op-bin:   # ephemeral bridge: populated by op-init, consumed by hermes-gateway

networks:
  hermes-net:
  # Created out-of-band on the host: `docker network create shared-services`.
  # Shared with the hindsight stack so hermes-gateway resolves `hindsight` by name.
  shared-services:
    external: true
