# $schema: https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
#
# Yandex Station self-hosted backend (v3rt3p). The speaker reaches this stack
# on the IoT VLAN. https-proxy holds SPEAKER_IP (TCP 80 and 443). quasar-server
# shares that network namespace so the control API on TCP 31116 is the same
# address. ntp.yantp.net is a tagged local zone for the IoT subnet and
# answers at OPNsense 192.168.99.1, which already serves NTP. This stack
# does not run an NTP server.
#
# ipvlan L2 parent is an SR-IOV virtual function on the LAN NIC (IOT_PARENT).
# That function is an access port for VLAN 99, so container frames leave tagged.
# The container addresses are not host ports, so the TrueNAS UI can keep *:80 and *:443.
# processor, quasistreaming-gigam, and supertonic-tts stay on the
# stack network. https-proxy is on both, and quasar-server uses that namespace,
# so those service names still resolve.
#
# The ipvlan address and parent are fixed in this file (192.168.99.10, ens1f0v2).
# Station state is a SQLite file on the host. OPENAI_API_KEY is read at
# processor start from /mnt/spool/apps/config/yandex-station/v3rt3p/.env,
# mounted by the daemon as the yandex_env secret. Portainer does not
# interpolate that file. POSTGRES_PASSWORD in the file is unused.
# This file has no build: keys. Portainer Git deploy builds whenever build:
# is present, and that build runs inside the Portainer container, which
# cannot mkdir /docker. Images are pulled from ghcr. An air-gap rebuild is
# stacks/yandex-station.build.yaml:
#   docker compose -f stacks/yandex-station.yaml -f stacks/yandex-station.build.yaml build
#
# Build contexts are five vendored git submodules under stacks/yandex-station/.
# Design: docs/superpowers/specs/2026-11-08-yandex-station-midi-self-host-design.md
# Plan:   docs/superpowers/plans/2026-11-08-yandex-station-midi-self-host.md

services:
  # Public entry: NGINX on :80/:443, eMudhra CA, per-domain P-384 certs at runtime.
  # YANDEX_UPSTREAM_URL overrides the first line of domains/yandex.txt (generate.sh
  # "<LIST>_UPSTREAM_URL" contract). quasar-server listens in this namespace.
  https-proxy:
    image: ghcr.io/salekseev/v3rt3p-https-proxy:2f27cb2
    container_name: v3rt3p-https-proxy
    restart: unless-stopped
    environment:
      YANDEX_UPSTREAM_URL: http://127.0.0.1:31115
    networks:
      default: {}
      iot:
        ipv4_address: 192.168.99.10

  # Main "maind" protocol server (Quasar backend emulator).
  # Shares https-proxy's namespace: 31115 and 31116 are on SPEAKER_IP.
  quasar-server:
    image: ghcr.io/salekseev/v3rt3p-quasar-server:4e778cb
    container_name: v3rt3p-quasar-server
    restart: unless-stopped
    network_mode: service:https-proxy
    # Same path as the upstream example: SQLITE_PATH /database/database.sqlite3.
    # https://v3rt3p.github.io/ru/services/quasar-server.html
    # POSTGRES_URL must stay unset; quasar-server prefers postgres when both are set.
    environment:
      ALLOW_UPDATES: "true"
      PORT: "31115"
      API_PORT: "31116"
      TTS_OPENAI_BASE_URL: http://supertonic-tts:9150
      TTS_OPENAI_VOICE: "${TTS_VOICE:-F1}"          # supertonic voices: M1–M5, F1–F5
      PROCESSOR_BASIC_URL: http://processor:8080    # base URL; processor appends its route
      STT_GIGAAM_URL: ws://quasistreaming-gigam:8080
      SQLITE_PATH: /database/database.sqlite3
    volumes:
      - /mnt/spool/apps/data/yandex-station/v3rt3p/quasar-server-db:/database
    depends_on:
      - https-proxy
      - processor
      - quasistreaming-gigam
      - supertonic-tts

  # ASR: GigaAM. Models self-download into the persistent cache below (do NOT
  # pre-copy legacy ONNX files — upstream README). Default CPU; GIGAAM_DEVICE=cuda
  # offloads to GPU (needs NVIDIA driver + Container Toolkit).
  quasistreaming-gigam:
    image: ghcr.io/salekseev/v3rt3p-quasistreaming-gigam:b0ffb57   # CPU variant
    container_name: v3rt3p-gigam
    restart: unless-stopped
    environment:
      GIGAAM_DEVICE: "${GIGAAM_DEVICE:-cpu}"        # cpu | cuda
      GIGAAM_DOWNLOAD_ROOT: /app/.cache/gigaam
    volumes:
      - /mnt/spool/apps/data/yandex-station/v3rt3p/gigaam-cache:/app/.cache/gigaam

  # TTS: self-hosted OpenAI-compatible service (Supertonic assets mounted RO).
  supertonic-tts:
    image: ghcr.io/salekseev/v3rt3p-supertonic-tts:171e703
    container_name: v3rt3p-tts
    restart: unless-stopped
    environment:
      ASSETS_PATH: /assets      # image default is /app/assets; mount is the HF supertonic-3 tree (onnx/ + voice_styles/)
    volumes:
      - /mnt/spool/apps/config/yandex-station/v3rt3p/supertonic-tts-assets:/assets:ro

  # Brain: builds prompts and calls codex-lb (stacks/codex-lb.yaml) with the
  # yandex key. Template env names are per processor/src/environment.ts (no
  # PROCESSOR_ prefix on the template paths).
  processor:
    image: ghcr.io/salekseev/v3rt3p-processor:a43e40e
    container_name: v3rt3p-processor
    restart: unless-stopped
    # quasar-server reaches this service by name on default. shared-services is
    # how this service reaches codex-lb. Listing any network drops the implicit default.
    networks:
      - default
      - shared-services
    # OPENAI_API_KEY comes from the env file at start, not from stack env.
    entrypoint:
      - sh
      - -c
      - |
        set -a
        . /run/secrets/yandex_env
        set +a
        exec pnpm start
    secrets:
      - yandex_env
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://codex-lb:2455/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      # Upstream Sentry.init always runs (tracesSampleRate 1) and its default
      # DSN is a sentry.io placeholder. This address is closed.
      SENTRY_DSN: https://disabled@127.0.0.1:9/1
      PROMPT_TEMPLATE_PATH: /prompt.handlebars
      STATE_PROMPT_TEMPLATE_PATH: /prompt-state.handlebars
      FUNCTIONS_PROMPT_TEMPLATE_PATH: /prompt-functions.handlebars
      CACHE_SIZE: "1000"
    volumes:
      - /mnt/spool/apps/config/yandex-station/v3rt3p/prompts/prompt.handlebars:/prompt.handlebars:ro
      - /mnt/spool/apps/config/yandex-station/v3rt3p/prompts/prompt-state.handlebars:/prompt-state.handlebars:ro
      - /mnt/spool/apps/config/yandex-station/v3rt3p/prompts/prompt-functions.handlebars:/prompt-functions.handlebars:ro

  # Healthchecks omitted by default (upstream images ship no proven probes for
  # these builds); add per service once a readiness signal is evidenced — the
  # real trust check is TLS to https://quasar.yandex.net on :443.

secrets:
  # Daemon bind-mounts this host file at /run/secrets/yandex_env.
  # Only the processor reads it, for OPENAI_API_KEY. Portainer does not open it.
  yandex_env:
    file: /mnt/spool/apps/config/yandex-station/v3rt3p/.env

networks:
  # Created out-of-band: `docker network create shared-services`.
  # The processor reaches codex-lb (stacks/codex-lb.yaml) by name here.
  shared-services:
    external: true
  iot:
    driver: ipvlan
    driver_opts:
      parent: ens1f0v2
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 192.168.99.0/24
          gateway: 192.168.99.1
