services:
  scrypted:
    environment:
      # TrueNAS 26 ships no host avahi-daemon, so run avahi inside the container.
      - SCRYPTED_DOCKER_AVAHI=true

    # NVIDIA (Part 1 of 2)
    runtime: nvidia

    # NVIDIA (Part 2 of 2) - Use NVIDIA image, and remove subsequent default image.
    image: ghcr.io/koush/scrypted:nvidia
    #image: ghcr.io/koush/scrypted

    volumes:
      # Default volume for the Scrypted database. Typically should not be changed.
      # The volume will be placed relative to this docker-compose.yml.
      - /mnt/spool/apps/config/scrypted:/server/volume

    devices: [
      # uncomment the common systems devices to pass
      # them through to docker.

      # all usb devices, such as coral tpu
      # "/dev/bus/usb:/dev/bus/usb",

      # hardware accelerated video decoding, opencl, etc.
      # "/dev/dri:/dev/dri",

      # AMD GPU
      # "/dev/kfd:/dev/kfd",

      # uncomment below as necessary.
      # zwave usb serial device

      # "/dev/ttyACM0:/dev/ttyACM0",

      # coral PCI devices
      # "/dev/apex_0:/dev/apex_0",
      # "/dev/apex_1:/dev/apex_1",
    ]

    container_name: scrypted
    restart: unless-stopped
    networks:
      lan-ipvlan:
        ipv4_address: 192.168.1.8

    # logging is noisy and will unnecessarily wear on flash storage.
    # scrypted has per device in memory logging that is preferred.
    # enable the log file if enhanced debugging is necessary.
    logging:
      driver: "none"
      # driver: "json-file"
      # options:
      #     max-size: "10m"
      #     max-file: "10"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


networks:
  lan-ipvlan:
    # Shared with go2rtc.yaml -- keep both definitions identical. Docker allows
    # only one network per subnet, so every LAN-IP container joins this one.
    name: lan-ipvlan
    driver: ipvlan
    driver_opts:
        # SR-IOV VF (not the PF) so the host can reach these containers.
        parent: ens1f0v1
        ipvlan_mode: l2
    ipam:
        config:
            - subnet: 192.168.1.0/24
              gateway: 192.168.1.1
              ip_range: 192.168.1.8/31
