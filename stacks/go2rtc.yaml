services:
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.15-hardware
    container_name: go2rtc
    runtime: nvidia
    volumes:
      - /mnt/spool/apps/config/go2rtc:/config
    restart: unless-stopped
    deploy:
     resources:
       reservations:
         devices:
           - driver: nvidia
             count: 1
             capabilities: [gpu]
    networks:
      lan-ipvlan:
        ipv4_address: 192.168.1.9
    ports:
      - 1984/tcp
      - 5353/udp
      - 8554/tcp
      - 8555/tcp
      - 8555/udp

networks:
  lan-ipvlan:
    # Shared with scrypted.yaml -- keep both definitions identical. Docker allows
    # only one network per subnet, so every LAN-IP container joins this one.
    name: lan-ipvlan
    driver: ipvlan
    driver_opts:
        # SR-IOV VF (not the PF) so the host can reach these containers.
        parent: ens1f0v1
        ipvlan_mode: l2
    ipam:
        config:
            - subnet: 192.168.1.0/24
              gateway: 192.168.1.1
              ip_range: 192.168.1.8/31
